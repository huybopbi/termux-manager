name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: android
            goarch: arm64
            asset: manager-android-arm64
          - goos: android
            goarch: arm
            goarm: "7"
            asset: manager-android-arm
          - goos: linux
            goarch: amd64
            asset: manager-linux-amd64
          - goos: linux
            goarch: arm64
            asset: manager-linux-arm64
          - goos: windows
            goarch: amd64
            asset: manager-windows-amd64.exe
          - goos: darwin
            goarch: arm64
            asset: manager-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ${{ matrix.asset }} .

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
