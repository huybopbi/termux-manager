name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all Android targets
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}

          GOOS=android GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/manager-android-arm64 .

          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/manager-android-arm .

          GOOS=android GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/manager-android-amd64 .

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/manager-linux-amd64 .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
