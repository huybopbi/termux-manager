<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Terminal — termux-manager</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/terminal.css" />
</head>
<body class="term-only">
  <div id="app" class="term-open term-expanded">
    <div id="term-panel" class="expanded standalone">
      <div id="term-header">
        <div id="term-tabs"></div>
        <div id="term-header-actions">
          <button id="btn-term-new" class="icon-btn" title="New tab">+</button>
          <a id="btn-term-files" class="icon-btn" href="/" title="File manager">📁</a>
          <button id="btn-term-close" class="icon-btn" title="Kill all sessions & back">✕</button>
        </div>
      </div>
      <div id="term-body">
        <div id="term-container"></div>
      </div>
      <div id="term-mobile-toolbar">
        <button type="button" class="mob-key mob-action" id="btn-term-copy" title="Copy screen (hold: more history)">Copy</button>
        <button type="button" class="mob-key mob-action" id="btn-term-paste" title="Paste">Paste</button>
        <button class="mob-key" data-key="&#x1b;">ESC</button>
        <button class="mob-key" data-key="&#x09;">TAB</button>
        <button class="mob-key" data-key="&#x01;">C-a</button>
        <button class="mob-key" data-key="&#x03;">C-c</button>
        <button class="mob-key" data-key="&#x04;">C-d</button>
        <button class="mob-key" data-key="&#x0c;">C-l</button>
        <button class="mob-key" data-key="&#x1b;[A">↑</button>
        <button class="mob-key" data-key="&#x1b;[B">↓</button>
        <button class="mob-key" data-key="&#x1b;[D">←</button>
        <button class="mob-key" data-key="&#x1b;[C">→</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // Minimal helpers so terminal.js works without app.js
    function toast(msg, type) {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }
    function promptModal(title, defaultVal) {
      return Promise.resolve(window.prompt(title, defaultVal || '') || '');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
  <script src="/terminal.js"></script>
</body>
</html>
